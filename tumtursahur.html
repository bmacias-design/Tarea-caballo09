<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 · Póster Editorial</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* Marco Contenedor */
    .poster-viewport {
      width: 320px;
      height: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Tarjeta ajustada para destacar sobre fondo blanco */
    .poster-card {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      will-change: transform, box-shadow, border-color;
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
    }

    .poster-viewport:hover .poster-card {
      border-color: rgba(0, 0, 0, 0.18);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.22);
    }

    .poster-image-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: -webkit-optimize-contrast;
      transform: translateZ(0);
    }
  </style>
</head>
<body>

  <div class="poster-viewport" id="posterViewport">
    <div class="poster-card" id="posterCard">
      <div class="poster-image-layer">
        <img
          class="poster-image"
          src="./public/poster/tung-tung-sahur.jpeg"
          alt="Póster Tung Tung Sahur"
        />
      </div>
    </div>
  </div>

  <script>
    const posterViewport = document.getElementById('posterViewport');
    const posterCard = document.getElementById('posterCard');

    const mouse = {
      targetScale: 1,
      currentScale: 1
    };

    posterViewport.addEventListener('mouseenter', () => {
      mouse.targetScale = 1.06;
    });

    posterViewport.addEventListener('mouseleave', () => {
      mouse.targetScale = 1.0;
    });

    function animate() {
      mouse.currentScale += (mouse.targetScale - mouse.currentScale) * 0.18;

      posterCard.style.transform = `scale(${mouse.currentScale}) translateZ(0)`;

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
